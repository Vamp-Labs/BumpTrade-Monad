[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.33"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./broadcast" }]

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[lint]
exclude_lints = ["unsafe-typecast", "asm-keccak256", "block-timestamp", "require-revert-in-loop", "reentrancy-events", "arbitrary-send-erc20"]
